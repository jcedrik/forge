AWSTemplateFormatVersion: "2010-09-09"
Description: >-
  forge 02-compute: ECR repository, ECS Fargate cluster and service running
  api-llm as a non-root user on a read-only filesystem in the private
  subnets, behind an internet-facing ALB that only serves HTTPS. Task role
  has no wildcard actions or resources.

Parameters:
  Project:
    Type: String
    Default: forge
  ImageTag:
    Type: String
    Default: latest
  CertificateArn:
    Type: String
    Description: ACM certificate for the ALB HTTPS listener (required).
    AllowedPattern: ^arn:aws:acm:.+$
  DesiredCount:
    Type: Number
    Default: 1
    MinValue: 0
    MaxValue: 4
  ModelProvider:
    Type: String
    Default: stub
    AllowedValues: [stub, openai]

Resources:
  Repository:
    Type: AWS::ECR::Repository
    DeletionPolicy: Delete
    UpdateReplacePolicy: Delete
    Properties:
      RepositoryName: !Sub ${Project}/api-llm
      ImageTagMutability: IMMUTABLE
      ImageScanningConfiguration:
        ScanOnPush: true
      EncryptionConfiguration:
        EncryptionType: KMS
        KmsKey: !ImportValue { "Fn::Sub": "${Project}-KeyArn" }
      EmptyOnDelete: true
      LifecyclePolicy:
        LifecyclePolicyText: '{"rules":[{"rulePriority":1,"description":"keep last 10","selection":{"tagStatus":"any","countType":"imageCountMoreThan","countNumber":10},"action":{"type":"expire"}}]}'

  Cluster:
    Type: AWS::ECS::Cluster
    Properties:
      ClusterName: !Ref Project
      ClusterSettings:
        - Name: containerInsights
          Value: enabled

  LogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub /${Project}/api-llm
      RetentionInDays: 30
      KmsKeyId: !ImportValue { "Fn::Sub": "${Project}-KeyArn" }

  # Pulls the image and reads the two secrets. Nothing else.
  ExecutionRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal: { Service: ecs-tasks.amazonaws.com }
            Action: sts:AssumeRole
      Policies:
        - PolicyName: pull-and-log
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action:
                  - ecr:GetAuthorizationToken
                Resource: "*"   # this API has no resource-level permissions
              - Effect: Allow
                Action:
                  - ecr:BatchGetImage
                  - ecr:GetDownloadUrlForLayer
                  - ecr:BatchCheckLayerAvailability
                Resource: !GetAtt Repository.Arn
              - Effect: Allow
                Action:
                  - logs:CreateLogStream
                  - logs:PutLogEvents
                Resource: !GetAtt LogGroup.Arn
              - Effect: Allow
                Action: secretsmanager:GetSecretValue
                Resource:
                  - !ImportValue { "Fn::Sub": "${Project}-DbSecretArn" }
                  - !ImportValue { "Fn::Sub": "${Project}-ApiTokenSecretArn" }
              - Effect: Allow
                Action: kms:Decrypt
                Resource: !ImportValue { "Fn::Sub": "${Project}-KeyArn" }

  # What the running application may do. Today: nothing beyond its own logs.
  TaskRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal: { Service: ecs-tasks.amazonaws.com }
            Action: sts:AssumeRole
      Policies:
        - PolicyName: app-runtime
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action:
                  - logs:PutLogEvents
                Resource: !GetAtt LogGroup.Arn

  TaskDefinition:
    Type: AWS::ECS::TaskDefinition
    Properties:
      Family: !Sub ${Project}-api-llm
      RequiresCompatibilities: [FARGATE]
      NetworkMode: awsvpc
      Cpu: "256"
      Memory: "512"
      RuntimePlatform:
        CpuArchitecture: ARM64
        OperatingSystemFamily: LINUX
      ExecutionRoleArn: !GetAtt ExecutionRole.Arn
      TaskRoleArn: !GetAtt TaskRole.Arn
      ContainerDefinitions:
        - Name: api-llm
          Image: !Sub ${AWS::AccountId}.dkr.ecr.${AWS::Region}.amazonaws.com/${Project}/api-llm:${ImageTag}
          Essential: true
          User: "10001:10001"
          ReadonlyRootFilesystem: true
          Privileged: false
          LinuxParameters:
            InitProcessEnabled: true
            Capabilities:
              Drop: [ALL]
          PortMappings:
            - ContainerPort: 8000
              Protocol: tcp
          Environment:
            - Name: MODEL_PROVIDER
              Value: !Ref ModelProvider
            - Name: RATE_LIMIT
              Value: "30"
            - Name: DB_HOST
              Value: !ImportValue { "Fn::Sub": "${Project}-DbEndpoint" }
          Secrets:
            - Name: DB_CREDENTIALS
              ValueFrom: !ImportValue { "Fn::Sub": "${Project}-DbSecretArn" }
            - Name: API_TOKEN
              ValueFrom: !ImportValue { "Fn::Sub": "${Project}-ApiTokenSecretArn" }
          HealthCheck:
            Command: ["CMD-SHELL", "python -c \"import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8000/healthz').status==200 else 1)\""]
            Interval: 30
            Timeout: 5
            Retries: 3
            StartPeriod: 20
          LogConfiguration:
            LogDriver: awslogs
            Options:
              awslogs-group: !Ref LogGroup
              awslogs-region: !Ref AWS::Region
              awslogs-stream-prefix: api

  Alb:
    Type: AWS::ElasticLoadBalancingV2::LoadBalancer
    Properties:
      Name: !Sub ${Project}-alb
      Scheme: internet-facing
      Type: application
      Subnets: !Split [",", !ImportValue { "Fn::Sub": "${Project}-PublicSubnets" }]
      SecurityGroups:
        - !ImportValue { "Fn::Sub": "${Project}-AlbSg" }
      LoadBalancerAttributes:
        - Key: routing.http.drop_invalid_header_fields.enabled
          Value: "true"
        - Key: deletion_protection.enabled
          Value: "false"
        - Key: access_logs.s3.enabled
          Value: "true"
        - Key: access_logs.s3.bucket
          Value: !ImportValue { "Fn::Sub": "${Project}-LogsBucket" }
        - Key: access_logs.s3.prefix
          Value: alb
  TargetGroup:
    Type: AWS::ElasticLoadBalancingV2::TargetGroup
    Properties:
      Name: !Sub ${Project}-tg
      VpcId: !ImportValue { "Fn::Sub": "${Project}-VpcId" }
      Port: 8000
      Protocol: HTTP
      TargetType: ip
      HealthCheckPath: /healthz
      HealthCheckIntervalSeconds: 15
      HealthyThresholdCount: 2
      UnhealthyThresholdCount: 3
      TargetGroupAttributes:
        - Key: deregistration_delay.timeout_seconds
          Value: "15"
  HttpsListener:
    Type: AWS::ElasticLoadBalancingV2::Listener
    Properties:
      LoadBalancerArn: !Ref Alb
      Port: 443
      Protocol: HTTPS
      SslPolicy: ELBSecurityPolicy-TLS13-1-2-2021-06
      Certificates:
        - CertificateArn: !Ref CertificateArn
      DefaultActions:
        - Type: forward
          TargetGroupArn: !Ref TargetGroup
  Service:
    Type: AWS::ECS::Service
    DependsOn: HttpsListener
    Properties:
      ServiceName: api-llm
      Cluster: !Ref Cluster
      LaunchType: FARGATE
      DesiredCount: !Ref DesiredCount
      TaskDefinition: !Ref TaskDefinition
      HealthCheckGracePeriodSeconds: 30
      DeploymentConfiguration:
        MinimumHealthyPercent: 100
        MaximumPercent: 200
        DeploymentCircuitBreaker:
          Enable: true
          Rollback: true
      NetworkConfiguration:
        AwsvpcConfiguration:
          AssignPublicIp: DISABLED
          Subnets: !Split [",", !ImportValue { "Fn::Sub": "${Project}-PrivateSubnets" }]
          SecurityGroups:
            - !ImportValue { "Fn::Sub": "${Project}-EcsSg" }
      LoadBalancers:
        - ContainerName: api-llm
          ContainerPort: 8000
          TargetGroupArn: !Ref TargetGroup

Outputs:
  AlbDnsName:
    Value: !GetAtt Alb.DNSName
    Export: { Name: !Sub "${Project}-AlbDns" }
  LogGroupName:
    Value: !Ref LogGroup
    Export: { Name: !Sub "${Project}-AppLogGroup" }
  RepositoryUri:
    Value: !GetAtt Repository.RepositoryUri
  AlbFullName:
    Value: !GetAtt Alb.LoadBalancerFullName
    Export: { Name: !Sub "${Project}-AlbFullName" }
  TargetGroupFullName:
    Value: !GetAtt TargetGroup.TargetGroupFullName
    Export: { Name: !Sub "${Project}-TgFullName" }
